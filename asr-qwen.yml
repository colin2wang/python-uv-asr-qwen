# Qwen3-ASR 服务配置
# 所有路径均为相对路径，相对于本文件所在目录解析。

model:
  asr_path: qwen-models/Qwen3-ASR-1.7B
  aligner_path: qwen-models/Qwen3-ForcedAligner-0.6B
  dtype: float16
  device: cuda:0
  max_inference_batch_size: 1

lid:
  # false：不加载 SenseVoice（当前主流程不调用它，装 funasr + 改 true 可启用）
  enabled: false
  model_path: qwen-models/SenseVoiceSmall
  device: cpu
  segment_seconds: 10

vad:
  frame_ms: 30
  hop_ms: 10
  threshold_db: -45.0
  min_silence_ms: 400
  min_speech_ms: 200

audio:
  sample_rate: 16000
  # 整段送入模型转写；> 0 时才按 VAD 静音点分块（分块会把跨块句子切断、丢失上下文）
  max_chunk_seconds: 0

sentence:
  # 相邻 token 停顿达到该值即断句；唱歌拖腔会产生大量长停顿、切出碎片，默认 0 关闭
  min_gap_seconds: 0.0
  # 主要切分依据：对齐 token 流不含标点，长度/时长是可靠的句段边界
  max_chars: 80
  max_duration_seconds: 12.0

title:
  max_chars: 80
  max_words: 18
  llm:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key: ""
    timeout_seconds: 15.0

server:
  title: Qwen3-ASR Multi-Lang + Timestamp Server
  version: 1.6.1
  host: 127.0.0.1
  port: 8010
  log_level: info
  workers: 1
