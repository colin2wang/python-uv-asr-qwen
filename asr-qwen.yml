# Qwen3-ASR service configuration
# All paths are relative and resolved against the directory of this file.

model:
  asr_path: qwen-models/Qwen3-ASR-1.7B
  aligner_path: qwen-models/Qwen3-ForcedAligner-0.6B
  dtype: float16
  device: cuda:0
  max_inference_batch_size: 1

lid:
  # false: do not load SenseVoice (unused in the main flow; install funasr and set true to enable)
  enabled: false
  model_path: qwen-models/SenseVoiceSmall
  device: cpu
  segment_seconds: 10

vad:
  frame_ms: 30
  hop_ms: 10
  threshold_db: -45.0
  min_silence_ms: 400
  min_speech_ms: 200

audio:
  sample_rate: 16000
  # 0: send the whole file to the model; > 0: VAD-chunk audio longer than this
  # (chunking cuts sentences that straddle a boundary and loses context)
  max_chunk_seconds: 0

sentence:
  # Break a segment when the pause between tokens reaches this; 0 disables it.
  # Sung vocals produce many long pauses and would fragment into one-second pieces.
  min_gap_seconds: 0.0
  # Main splitting rule: aligner tokens carry no punctuation, so length and duration
  # are the reliable segment boundaries
  max_chars: 80
  max_duration_seconds: 12.0

title:
  max_chars: 80
  max_words: 18
  llm:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key: ""
    timeout_seconds: 15.0

server:
  title: Qwen3-ASR Multi-Lang + Timestamp Server
  version: 1.6.1
  host: 127.0.0.1
  port: 8010
  log_level: info
  workers: 1
